<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mario-Style Platformer</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #1a1a2e; color: #e9edf6; font: 14px ui-monospace, monospace; }
      #hud { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 8px 12px; background: rgba(0,0,0,0.6); border-radius: 4px; font-family: monospace; font-size: 14px; pointer-events: none; }
      canvas { display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
